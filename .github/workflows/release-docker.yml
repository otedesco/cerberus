name: Release Docker Images

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  quality-checks:
    uses: otedesco/gh-action-templates/.github/workflows/lint-and-test.yml@dc35994d4f78f96059e0a13008e04d12c2ad51f9 # central coverage gate release 2026-09-02
    with:
      registry-auth-required: true
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  release-docker:
    needs: [quality-checks]
    uses: otedesco/gh-action-templates/.github/workflows/release-docker-image.yml@dc35994d4f78f96059e0a13008e04d12c2ad51f9 # central coverage gate release 2026-09-02
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
