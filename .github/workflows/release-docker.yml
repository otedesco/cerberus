name: Release Docker Images

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  quality-checks:
    uses: otedesco/gh-action-templates/.github/workflows/lint-and-test.yml@5024403d1e4eaf9a26603fb71773a5260ea5f370 # central coverage report compatibility release 2026-09-03
    with:
      registry-auth-required: true
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  release-docker:
    needs: [quality-checks]
    uses: otedesco/gh-action-templates/.github/workflows/release-docker-image.yml@5024403d1e4eaf9a26603fb71773a5260ea5f370 # central coverage report compatibility release 2026-09-03
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
