name: Release Docker Images

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  quality-checks:
    uses: otedesco/gh-action-templates/.github/workflows/lint-and-test.yml@0a9c7f317a2e922aed37b526918fa16d51b8041e # OPS-182 consumer compatibility fix
    with:
      registry-auth-required: true
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  release-docker:
    needs: [quality-checks]
    uses: otedesco/gh-action-templates/.github/workflows/release-docker-image.yml@0a9c7f317a2e922aed37b526918fa16d51b8041e # OPS-182 consumer compatibility fix
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
